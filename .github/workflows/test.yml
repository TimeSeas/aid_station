name: Verify mini program and PHP API
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, fileinfo, openssl
          coverage: none
      - name: PHP syntax
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify source, API and access control
        run: npm test
